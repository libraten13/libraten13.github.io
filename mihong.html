<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>霓虹深渊 · NEON ABYSS</title>
<style>
:root{
  --cyan:#2ee6ff;
  --pink:#ff2e6b;
  --violet:#a855f7;
  --gold:#ffc94a;
  --green:#4ade80;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:#04050d;}
body{
  font-family:"PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#dff2ff;
  user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:none;
}
#app{position:fixed;inset:0;overflow:hidden;}
canvas{position:absolute;inset:0;display:block;transition:filter .35s cubic-bezier(.4,0,.2,1);}
canvas.dim{filter:blur(7px) brightness(.42) saturate(.85);}

/* ===== HUD ===== */
#hud{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .45s;}
#hud.on{opacity:1;}
.topbar{
  position:absolute;top:0;left:0;right:0;
  display:flex;justify-content:center;gap:30px;
  padding:16px;
  font-variant-numeric:tabular-nums;
}
.stat{display:flex;flex-direction:column;align-items:center;gap:3px;}
.stat .k{font-size:9px;letter-spacing:.22em;color:rgba(180,215,255,.42);font-weight:500;}
.stat .v{font-size:20px;font-weight:600;letter-spacing:.03em;color:#e8f8ff;text-shadow:0 0 14px rgba(46,230,255,.55);}
.bottombar{
  position:absolute;left:50%;transform:translateX(-50%);bottom:26px;
  width:min(430px,74vw);
  display:flex;flex-direction:column;gap:7px;
}
.bar{
  position:relative;border-radius:99px;overflow:hidden;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.09);
}
.bar>i{
  position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;
  transition:width .14s linear;
}
.xpbar{height:8px;}
#xpfill{background:linear-gradient(90deg,#2ee6ff,#4ade80);box-shadow:0 0 16px rgba(74,222,128,.65);}
.hpbar{height:20px;}
#hpfill{background:linear-gradient(90deg,#ff2e6b,#ff8a1f);box-shadow:0 0 16px rgba(255,46,107,.55);}
#hptext{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;letter-spacing:.1em;
  text-shadow:0 1px 4px rgba(0,0,0,.9);
  font-variant-numeric:tabular-nums;
}
#lvlbadge{
  position:absolute;left:-4px;top:-26px;
  font-size:10px;letter-spacing:.18em;font-weight:700;color:rgba(46,230,255,.85);
  text-shadow:0 0 12px rgba(46,230,255,.7);
}
#mute{
  position:absolute;right:16px;bottom:26px;pointer-events:auto;
  width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);
  color:rgba(200,230,255,.6);font-size:15px;cursor:pointer;
  display:grid;place-items:center;transition:.2s;
}
#mute:hover{background:rgba(46,230,255,.12);color:#bff3ff;}

/* ===== Overlay ===== */
.overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .32s;
  background:radial-gradient(circle at 50% 48%, rgba(8,14,34,.55), rgba(2,3,9,.9));
  padding:24px;
}
.overlay.on{opacity:1;pointer-events:auto;}
.eyebrow{
  font-size:11px;letter-spacing:.55em;color:rgba(46,230,255,.62);
  font-weight:500;text-indent:.55em;margin-bottom:10px;
}
.title{
  font-size:clamp(30px,7vw,46px);font-weight:800;letter-spacing:.06em;
  background:linear-gradient(180deg,#f2fdff,#6ec8ff 58%,#2e7fff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 26px rgba(46,180,255,.55));
  margin-bottom:8px;
}
.sub{font-size:12px;letter-spacing:.3em;color:rgba(150,190,230,.5);margin-bottom:34px;text-indent:.3em;}
.tips{
  font-size:12px;line-height:2;color:rgba(150,190,230,.55);text-align:center;
  margin-bottom:30px;letter-spacing:.04em;
}
.tips b{color:rgba(46,230,255,.85);font-weight:600;}
.btn{
  padding:14px 50px;border-radius:99px;
  border:1px solid rgba(46,230,255,.45);
  background:linear-gradient(180deg,rgba(46,230,255,.16),rgba(46,230,255,.03));
  color:#bff3ff;font-size:15px;font-weight:600;letter-spacing:.24em;
  cursor:pointer;transition:.25s;text-indent:.24em;
  font-family:inherit;backdrop-filter:blur(6px);
}
.btn:hover{
  background:linear-gradient(180deg,rgba(46,230,255,.3),rgba(46,230,255,.07));
  box-shadow:0 0 34px rgba(46,230,255,.38);transform:translateY(-2px);
}
.btn:active{transform:translateY(0);}
.btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}
.btns .btn{padding:14px 38px;font-size:14px;letter-spacing:.18em;text-indent:.18em;}
.btn.ghost{
  border-color:rgba(190,215,255,.22);
  background:linear-gradient(180deg,rgba(190,215,255,.07),rgba(190,215,255,.01));
  color:rgba(212,228,255,.72);
}
.btn.ghost:hover{
  background:linear-gradient(180deg,rgba(190,215,255,.15),rgba(190,215,255,.03));
  box-shadow:0 0 26px rgba(180,215,255,.2);
}

/* 制作人署名 */
.credit{
  margin-top:30px;
  font-size:11px;letter-spacing:.26em;text-indent:.26em;
  color:rgba(150,190,230,.4);
  display:flex;align-items:center;gap:8px;
  animation:fadeUp .8s .35s cubic-bezier(.4,0,.2,1) backwards;
}
.credit::before,.credit::after{
  content:'';width:26px;height:1px;
  background:linear-gradient(90deg,rgba(46,230,255,0),rgba(46,230,255,.45));
}
.credit::after{background:linear-gradient(90deg,rgba(46,230,255,.45),rgba(46,230,255,0));}
.credit span{
  color:rgba(120,240,255,.92);font-weight:600;letter-spacing:.14em;
  text-shadow:0 0 14px rgba(46,230,255,.65);
}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}}

/* ===== Boss 血条 ===== */
.bossbar{
  position:absolute;top:68px;left:50%;transform:translateX(-50%) translateY(-6px);
  width:min(560px,82vw);
  opacity:0;pointer-events:none;
  transition:opacity .45s,transform .45s cubic-bezier(.34,1.4,.64,1);
}
.bossbar.on{opacity:1;transform:translateX(-50%) translateY(0);}
.boss-meta{display:flex;align-items:baseline;justify-content:center;gap:10px;margin-bottom:7px;}
.boss-meta span{
  font-size:14px;font-weight:800;letter-spacing:.18em;
  color:#ffe1ea;text-shadow:0 0 16px rgba(255,46,107,.8);
}
.boss-meta em{
  font-size:9px;letter-spacing:.26em;font-style:normal;
  color:rgba(255,180,200,.45);
}
.boss-hpbar{
  height:9px;border-radius:99px;overflow:hidden;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,46,107,.32);
  box-shadow:0 0 22px rgba(255,46,107,.22);
}
.boss-hpbar>i{
  display:block;height:100%;width:100%;border-radius:99px;
  background:linear-gradient(90deg,#ff2e6b,#ff8a1f 70%,#ffc94a);
  box-shadow:0 0 18px rgba(255,46,107,.85);
  transition:width .16s linear;
}

/* ===== Boss 来袭横幅 ===== */
.warn{
  position:absolute;top:36%;left:50%;
  transform:translate(-50%,-50%) scale(.9);
  text-align:center;opacity:0;pointer-events:none;
  transition:opacity .28s,transform .4s cubic-bezier(.34,1.5,.64,1);
}
.warn.on{opacity:1;transform:translate(-50%,-50%) scale(1);}
.warn b{
  display:block;
  font-size:clamp(24px,5.6vw,44px);font-weight:800;
  letter-spacing:.32em;text-indent:.32em;
  color:#ff5b7f;
  text-shadow:0 0 30px rgba(255,46,107,.95),0 0 70px rgba(255,46,107,.45);
  animation:warnPulse 1s ease-in-out infinite;
}
.warn span{
  display:block;margin-top:12px;
  font-size:12px;letter-spacing:.3em;text-indent:.3em;
  color:rgba(255,200,212,.85);
  text-shadow:0 0 18px rgba(255,46,107,.6);
}
@keyframes warnPulse{0%,100%{opacity:1}50%{opacity:.5}}

/* ===== 下次 Boss 倒计时 ===== */
.nextboss{
  position:absolute;right:18px;top:20px;
  font-size:10px;letter-spacing:.16em;
  color:rgba(255,150,180,.42);
  font-variant-numeric:tabular-nums;
  transition:color .3s;
}
.nextboss.soon{color:rgba(255,110,150,.95);text-shadow:0 0 14px rgba(255,46,107,.8);}

/* ===== 升级卡 ===== */
.cards{display:flex;gap:15px;flex-wrap:wrap;justify-content:center;}
.card{
  position:relative;width:188px;padding:24px 16px 18px;
  border-radius:16px;
  background:linear-gradient(160deg,rgba(24,34,62,.9),rgba(9,13,26,.96));
  border:1px solid rgba(120,180,255,.16);
  display:flex;flex-direction:column;align-items:center;gap:9px;
  cursor:pointer;overflow:hidden;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1), border-color .2s, box-shadow .25s;
  animation:cardIn .4s cubic-bezier(.34,1.4,.64,1) backwards;
}
@keyframes cardIn{from{opacity:0;transform:translateY(26px) scale(.93);}}
.card:hover{transform:translateY(-7px) scale(1.03);}
.card-icon{
  width:48px;height:48px;border-radius:13px;display:grid;place-items:center;
  font-size:22px;margin-bottom:2px;
  background:rgba(46,230,255,.07);
  border:1px solid rgba(46,230,255,.22);
  color:var(--cyan);
  transition:.2s;
}
.card-name{font-size:14px;font-weight:700;letter-spacing:.05em;color:#eaf9ff;}
.card-desc{font-size:11.5px;line-height:1.65;color:rgba(160,200,235,.72);text-align:center;min-height:38px;}
.card-lv{
  font-size:9.5px;letter-spacing:.14em;color:rgba(140,180,220,.42);
  font-variant-numeric:tabular-nums;margin-top:2px;
}
.card.common{border-color:rgba(46,230,255,.28);}
.card.common .card-icon{color:#2ee6ff;background:rgba(46,230,255,.07);border-color:rgba(46,230,255,.22);}
.card.common:hover{border-color:rgba(46,230,255,.7);box-shadow:0 0 32px rgba(46,230,255,.28),inset 0 0 24px rgba(46,230,255,.05);}
.card.rare{border-color:rgba(168,85,247,.32);}
.card.rare .card-icon{color:#c084fc;background:rgba(168,85,247,.09);border-color:rgba(168,85,247,.26);}
.card.rare:hover{border-color:rgba(168,85,247,.8);box-shadow:0 0 32px rgba(168,85,247,.3),inset 0 0 24px rgba(168,85,247,.06);}
.card.epic{border-color:rgba(255,201,74,.38);}
.card.epic .card-icon{color:#ffc94a;background:rgba(255,201,74,.09);border-color:rgba(255,201,74,.28);}
.card.epic:hover{border-color:rgba(255,201,74,.85);box-shadow:0 0 34px rgba(255,201,74,.3),inset 0 0 24px rgba(255,201,74,.06);}

/* ===== 结算 ===== */
.result{
  display:grid;grid-template-columns:repeat(2,minmax(120px,1fr));
  gap:1px;margin:6px 0 34px;
  background:rgba(120,180,255,.1);border:1px solid rgba(120,180,255,.12);
  border-radius:14px;overflow:hidden;
}
.result div{
  padding:16px 26px;background:rgba(6,10,22,.9);
  display:flex;flex-direction:column;align-items:center;gap:5px;
}
.result .rk{font-size:9.5px;letter-spacing:.2em;color:rgba(150,190,230,.42);}
.result .rv{font-size:20px;font-weight:700;color:#e8f8ff;font-variant-numeric:tabular-nums;}
.hint{font-size:11px;color:rgba(140,180,220,.35);margin-top:20px;letter-spacing:.1em;}
@media (max-width:560px){
  .card{width:140px;padding:18px 10px 14px;}
  .card-name{font-size:12.5px;}
  .card-desc{font-size:10.5px;min-height:44px;}
  .card-icon{width:40px;height:40px;font-size:18px;}
  .cards{gap:9px;}
  .topbar{gap:18px;}
  .stat .v{font-size:16px;}
}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div class="topbar">
      <div class="stat"><span class="k">TIME</span><span class="v" id="uiTime">00:00</span></div>
      <div class="stat"><span class="k">KILLS</span><span class="v" id="uiKills">0</span></div>
      <div class="stat"><span class="k">WAVE</span><span class="v" id="uiWave">1</span></div>
    </div>
    <div class="bottombar">
      <span id="lvlbadge">LV.1</span>
      <div class="bar xpbar"><i id="xpfill"></i></div>
      <div class="bar hpbar"><i id="hpfill"></i><span id="hptext">100 / 100</span></div>
    </div>
    <div class="bossbar" id="bossbar">
      <div class="boss-meta"><span id="bossName"></span><em id="bossEn"></em></div>
      <div class="boss-hpbar"><i id="bossHp"></i></div>
    </div>
    <div class="nextboss" id="nextboss"></div>
    <div class="warn" id="warnBanner"><b id="warnTitle">WARNING</b><span id="warnSub"></span></div>
    <button id="mute" title="音效开关">♪</button>
  </div>

  <div id="start" class="overlay on">
    <div class="eyebrow">ROGUELIKE · SURVIVAL</div>
    <div class="title">霓虹深渊</div>
    <div class="sub">N E O N &nbsp; A B Y S S</div>
    <div class="tips">
      <b>WASD</b> / <b>方向键</b> 移动 &nbsp;·&nbsp; 武器<b>自动锁定</b>最近目标<br/>
      拾取能量核心升级，每次三选一强化构筑<br/>
      活得越久，深渊越疯狂
    </div>
    <button class="btn" id="btnStart">进入深渊</button>
    <div class="credit">制作人 <span>libra小贺</span></div>
  </div>

  <div id="levelup" class="overlay">
    <div class="eyebrow">LEVEL UP</div>
    <div class="title" style="font-size:26px;margin-bottom:22px;">选择强化</div>
    <div class="cards" id="cards"></div>
    <div class="hint">点击卡片装备</div>
  </div>

  <div id="over" class="overlay">
    <div class="eyebrow">RUN TERMINATED</div>
    <div class="title" style="font-size:28px;">你被深渊吞噬了</div>
    <div class="result">
      <div><span class="rk">存活时间</span><span class="rv" id="rsTime">00:00</span></div>
      <div><span class="rk">击杀数</span><span class="rv" id="rsKills">0</span></div>
      <div><span class="rk">等级</span><span class="rv" id="rsLv">1</span></div>
      <div><span class="rk">波次</span><span class="rv" id="rsWave">1</span></div>
    </div>
    <div class="btns">
      <button class="btn" id="btnRetry">重新开始</button>
      <button class="btn ghost" id="btnHome">返回主页</button>
    </div>
  </div>

  <div id="win" class="overlay">
    <div class="eyebrow">ABYSS CLEARED</div>
    <div class="title" style="font-size:30px;">深渊已净化</div>
    <div class="sub" style="margin-bottom:26px;">你击溃了全部五个深渊守卫</div>
    <div class="result">
      <div><span class="rk">通关时间</span><span class="rv" id="winTime">00:00</span></div>
      <div><span class="rk">总击杀</span><span class="rv" id="winKills">0</span></div>
      <div><span class="rk">最终等级</span><span class="rv" id="winLv">1</span></div>
      <div><span class="rk">剩余生命</span><span class="rv" id="winHp">0</span></div>
    </div>
    <div class="btns">
      <button class="btn" id="btnWinAgain">再战深渊</button>
      <button class="btn ghost" id="btnWinHome">返回主页</button>
    </div>
  </div>
</div>

<script>
(function () {
'use strict';

/* ========== 基础工具 ========== */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => (a + Math.random() * (b - a + 1)) | 0;
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const rgba = (c, a) => 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';

const COL = {
  player: [64, 226, 255],
  bullet: [150, 245, 255],
  xp: [110, 255, 170],
  hit: [255, 240, 200],
  danger: [255, 46, 107],
  gold: [255, 201, 74],
  ice: [140, 210, 255],
  heal: [80, 255, 150],
  purple: [190, 120, 255]
};

/* ========== 画布 ========== */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
let bgGrad = null, vignette = null, hurtGrad = null;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bgGrad = null;
  vignette = null;
  hurtGrad = null;
}
window.addEventListener('resize', resize);

/* ========== 辉光贴图缓存 ========== */
const glowCache = new Map();
function glowSprite(c) {
  const key = c[0] + ',' + c[1] + ',' + c[2];
  let s = glowCache.get(key);
  if (s) return s;
  const S = 128;
  const cnv = document.createElement('canvas');
  cnv.width = cnv.height = S;
  const g = cnv.getContext('2d');
  const grd = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  grd.addColorStop(0, rgba(c, 0.95));
  grd.addColorStop(0.18, rgba(c, 0.55));
  grd.addColorStop(0.42, rgba(c, 0.2));
  grd.addColorStop(0.72, rgba(c, 0.05));
  grd.addColorStop(1, rgba(c, 0));
  g.fillStyle = grd;
  g.fillRect(0, 0, S, S);
  glowCache.set(key, cnv);
  return cnv;
}
function glow(x, y, r, c, alpha) {
  const sp = glowSprite(c);
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.drawImage(sp, x - r, y - r, r * 2, r * 2);
  ctx.globalAlpha = 1;
}

/* ========== 音效（合成，无外部资源） ========== */
const Sfx = (function () {
  let actx = null, muted = false, lastShot = 0;
  function init() {
    if (actx) return;
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
  }
  function tone(freq, dur, type, vol, slideTo) {
    if (!actx || muted) return;
    const t = actx.currentTime;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(24, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.03);
  }
  return {
    init,
    toggle: function () { muted = !muted; return muted; },
    isMuted: function () { return muted; },
    shoot: function () {
      const now = performance.now();
      if (now - lastShot < 55) return;
      lastShot = now;
      tone(760 + Math.random() * 90, 0.075, 'square', 0.022, 380);
    },
    hit: function () { tone(220 + Math.random() * 60, 0.05, 'sine', 0.016, 120); },
    kill: function () { tone(150, 0.16, 'triangle', 0.05, 50); },
    hurt: function () { tone(120, 0.28, 'sawtooth', 0.06, 42); },
    level: function () {
      tone(520, 0.14, 'sine', 0.05, 700);
      setTimeout(function () { tone(780, 0.22, 'sine', 0.045, 1040); }, 90);
    },
    pick: function () { tone(1100 + Math.random() * 200, 0.035, 'sine', 0.014); },
    boom: function () { tone(90, 0.34, 'sawtooth', 0.055, 30); }
  };
})();

/* ========== 输入 ========== */
const keys = Object.create(null);
window.addEventListener('keydown', function (e) {
  keys[e.key.toLowerCase()] = true;
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].indexOf(e.key.toLowerCase()) >= 0) e.preventDefault();
});
window.addEventListener('keyup', function (e) { keys[e.key.toLowerCase()] = false; });

const touch = { active: false, ox: 0, oy: 0, x: 0, y: 0, id: null };
function bindTouch() {
  cv.addEventListener('touchstart', function (e) {
    if (game.state !== 'playing') return;
    const t = e.changedTouches[0];
    touch.active = true; touch.id = t.identifier;
    touch.ox = t.clientX; touch.oy = t.clientY;
    touch.x = t.clientX; touch.y = t.clientY;
    e.preventDefault();
  }, { passive: false });
  cv.addEventListener('touchmove', function (e) {
    if (!touch.active) return;
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier === touch.id) { touch.x = t.clientX; touch.y = t.clientY; }
    }
    e.preventDefault();
  }, { passive: false });
  function end(e) {
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === touch.id) { touch.active = false; touch.id = null; }
    }
  }
  cv.addEventListener('touchend', end);
  cv.addEventListener('touchcancel', end);
}

function distToRay(px, py, ox, oy, ang, len) {
  const dx = Math.cos(ang), dy = Math.sin(ang);
  let t = (px - ox) * dx + (py - oy) * dy;
  if (t < 0) t = 0; else if (t > len) t = len;
  return Math.hypot(px - (ox + dx * t), py - (oy + dy * t));
}

function eb(x, y, ang, spd, r, dmg, color, extra) {

    x: x, y: y,
    vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
    r: r, dmg: dmg, life: 5, color: color, age: 0
  }, extra || {});
  ebullets.push(b);
  return b;
}
